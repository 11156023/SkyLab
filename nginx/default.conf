# SkyLab 反向代理 —— 單一對外入口 :80
# 同源分流：/api、/ws、/docs 等 → backend:8000；其餘 → frontend:80
#
# 前端 VITE_API_URL 留空 → API 走相對路徑、WebSocket 用 window.location.host，
# 因此一切同源：免 CORS、不綁定固定 host，從哪個 IP/網域進來就走那個，IP 變動無感。

server {
    listen 80;
    server_name _;
    # 把 scheme 留在 proxy_pass directive、host:port 放在變數，
    # 強制 nginx 用 resolver 在每次請求時解析，避開 startup DNS lookup
    # 造成 emerg（當 backend / frontend 容器尚未進入 Docker DNS 時會發生）。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # 預設限制 body 大小，避免無上限的請求耗盡後端記憶體/磁碟；
    # 檔案上傳只發生在 /api/，該 location 另設較高上限。
    # 關閉請求緩衝（邊收邊轉），大檔不會先落在 nginx 暫存。
    client_max_body_size 1m;
    proxy_request_buffering off;

    # 後端 REST API（含頭像 / 評分表 / 範本附件等上傳）
    location /api/ {
        client_max_body_size 256m;
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 前端 AI-PVE request deadline 為 120s；代理略長以避免同刻競速。
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    # OpenAPI 文件
    location ~ ^/(docs|redoc|openapi\.json) {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # VNC / Terminal WebSocket（需要 upgrade，長連線）
    location /ws/ {
        # 握手 URL 的 query string 帶有 access token，不可寫入 access log
        access_log off;
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 前端 SPA（frontend 容器內的 nginx 已處理 try_files fallback）
    location / {
        set $frontend_upstream frontend:80;
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
