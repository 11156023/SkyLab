# SkyLab 反向代理 —— 單一對外入口 :80
# 同源分流：/api、/ws、/docs 等 → backend:8000；其餘 → frontend:8080
#
# 前端 VITE_API_URL 留空 → API 走相對路徑、WebSocket 用 window.location.host，
# 因此一切同源：免 CORS、不綁定固定 host，從哪個 IP/網域進來就走那個，IP 變動無感。

# upstream 用 `resolve` 在執行期經 Docker DNS 動態解析（nginx OSS ≥ 1.27.3），
# 啟動時容器名還查不到也不會 emerg，取代先前「proxy_pass 放變數」的寫法；
# 好處是可以搭配 keepalive 保留到上游的連線池，不再每個請求重開一條 TCP。
# 日後 backend 多容器（docker compose up --scale backend=N）時 Docker DNS 會
# 回多筆 A 記錄，這裡自動變成負載均衡，不必改設定。
upstream backend_pool {
    zone backend_pool 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    server backend:8000 resolve;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

upstream frontend_pool {
    zone frontend_pool 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    server frontend:8080 resolve;
    keepalive 16;
}

# 監控 stack（docker compose --profile monitoring）的 Grafana；沒啟用該 profile
# 時容器名解析不到，`resolve` 讓 nginx 照常啟動，/grafana/ 只會回 502。
# 走 grafana-authproxy 網路上的別名：連線來源才會是 nginx 在那個網路的固定 IP，
# 也就是 Grafana auth.proxy 唯一信任的來源（見 docker-compose.yml）。
upstream grafana_pool {
    zone grafana_pool 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    server grafana-authproxy:3000 resolve;
    keepalive 8;
}

# WebSocket 升級時送 upgrade，一般請求送空字串（保留到上游的 keep-alive）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# access log 帶 request id 與耗時：同一個 $request_id 會以 X-Request-ID 轉給
# backend，並出現在後端 JSON 日誌的 request_id 欄位，三邊可以直接對上。
log_format skylab '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                  'rid=$request_id rt=$request_time urt=$upstream_response_time';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log skylab;

    # 回應壓縮：JS bundle（monaco、recharts、react-vnc）與 API JSON 都受惠。
    # gzip_proxied any 必須開，這裡所有回應都來自上游，不開會一律略過壓縮。
    # text/event-stream 刻意不列入：串流回應壓縮會被緩衝住。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/manifest+json
        image/svg+xml application/wasm font/ttf application/vnd.ms-fontobject;

    # 預設限制 body 大小，避免無上限的請求耗盡後端記憶體/磁碟；
    # 檔案上傳只發生在 /api/，該 location 另設較高上限。
    # 關閉請求緩衝（邊收邊轉），大檔不會先落在 nginx 暫存。
    client_max_body_size 1m;
    proxy_request_buffering off;

    # 共用代理設定。到上游的 keep-alive 需要 HTTP/1.1 且清空 Connection 標頭；
    # HTTP/1.1 也是 chunked 上傳（不緩衝直送）的前提。
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 一律以 nginx 產生的 id 覆寫，客戶端自帶的 X-Request-ID 不往後傳
    proxy_set_header X-Request-ID $request_id;

    # 容器 healthcheck 用；不進 access log
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /metrics 與 /metrics/gateway-targets（Prometheus http_sd，含 Gateway 內網位址）
    # 只給內網的 Prometheus 直接連 backend:8000，不經對外入口
    location ^~ /metrics {
        return 404;
    }

    # 後端 REST API（含頭像 / 評分表 / 範本附件等上傳）
    location /api/ {
        client_max_body_size 256m;
        proxy_pass http://backend_pool;
        # 前端 AI-PVE request deadline 為 120s；代理略長以避免同刻競速。
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    # OpenAPI 文件
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://backend_pool;
    }

    # VNC / Terminal WebSocket（需要 upgrade，長連線）
    location /ws/ {
        # 握手 URL 的 query string 帶有 access token，不可寫入 access log
        access_log off;
        proxy_pass http://backend_pool;
        # WebSocket 要把 Connection 改成 upgrade；location 內一旦出現
        # proxy_set_header 就不再繼承 server 層那組，所以這裡要全部重列。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Grafana（監控 profile），serve_from_sub_path。SkyLab 管理員免密碼登入：
    # 資源監控頁發 skylab_grafana cookie（只在 /grafana/ 送出），這裡每個請求先
    # auth_request 問後端，後端回的身分標頭再交給 Grafana auth.proxy。
    # X-WEBAUTH-* 一律由這裡設定：值為空字串時 nginx 不送該標頭，瀏覽器自己帶的
    # 同名標頭也不會往後傳，所以無法偽造身分。Grafana 另外只信任本容器在
    # grafana-authproxy 網路上的固定 IP（compose 的 GF_AUTH_PROXY_WHITELIST）。
    # Grafana Live 走 WebSocket，所以同樣要 upgrade。
    location /grafana/ {
        auth_request /_grafana_auth;
        auth_request_set $grafana_user  $upstream_http_x_webauth_user;
        auth_request_set $grafana_email $upstream_http_x_webauth_email;
        auth_request_set $grafana_name  $upstream_http_x_webauth_name;
        auth_request_set $grafana_role  $upstream_http_x_webauth_role;
        # 後端掛掉時 auth_request 會變成 500：改走不帶身分的 Grafana，原本的
        # 帳密登入頁仍可當備用入口（proxy_intercept_errors 預設關閉，Grafana
        # 自己回的 5xx 不會進到這裡）
        error_page 500 502 503 504 = @grafana_anonymous;
        proxy_pass http://grafana_pool;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-WEBAUTH-USER  $grafana_user;
        proxy_set_header X-WEBAUTH-EMAIL $grafana_email;
        proxy_set_header X-WEBAUTH-NAME  $grafana_name;
        proxy_set_header X-WEBAUTH-ROLE  $grafana_role;
    }

    # Grafana 的 JS／CSS／字型不需要身分，省掉每個檔案一次 auth_request
    location ^~ /grafana/public/ {
        proxy_pass http://grafana_pool;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-WEBAUTH-USER  "";
        proxy_set_header X-WEBAUTH-EMAIL "";
        proxy_set_header X-WEBAUTH-NAME  "";
        proxy_set_header X-WEBAUTH-ROLE  "";
    }

    location @grafana_anonymous {
        proxy_pass http://grafana_pool;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-WEBAUTH-USER  "";
        proxy_set_header X-WEBAUTH-EMAIL "";
        proxy_set_header X-WEBAUTH-NAME  "";
        proxy_set_header X-WEBAUTH-ROLE  "";
    }

    location = /_grafana_auth {
        internal;
        proxy_pass http://backend_pool/api/v1/monitoring/grafana/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # 上面那個驗證端點只給 nginx 內部用，不從對外入口開放
    location = /api/v1/monitoring/grafana/auth {
        return 404;
    }

    # 前端 SPA（frontend 容器內的 nginx 已處理 try_files fallback 與 Cache-Control）
    # 50x 只攔這個 location：前端容器掛掉（或回 5xx）時給靜態錯誤頁；
    # /api、/ws 不攔——fetch 客戶端要拿原始回應，錯誤呈現由前端統一處理。
    location / {
        proxy_pass http://frontend_pool;
        proxy_intercept_errors on;
        error_page 500 502 503 504 /50x.html;
    }

    # 靜態 50x 頁（compose 掛載進來），internal 防止直接存取
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
