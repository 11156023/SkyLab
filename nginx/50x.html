<!DOCTYPE html>
<!-- 外層 nginx 的 50x 靜態錯誤頁：前端容器掛掉時由反向代理直接回這頁。
     完全自足（inline CSS、無外部資源、無 JS 依賴），文案與站內統一錯誤句一致；
     動畫比照 404 頁（雲朵浮沉、背景淡雲漂移、閃電閃爍），reduced-motion 時全部靜止。 -->
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkyLab</title>
  <style>
    :root {
      --bg-top: #dfe9fb;
      --bg-bottom: #f6f2df;
      --surface: #ffffff;
      --primary: #5471bf;
      --text: #5471bf;
      --text-secondary: #617dc8;
      --border: #e5eaf3;
      --cloud-faint: #eef2fb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-top: #0e1320;
        --bg-bottom: #161b26;
        --surface: #2a3142;
        --primary: #4361a2;
        --text: #d4deef;
        --text-secondary: #d9e8ff;
        --border: #2a3142;
        --cloud-faint: #1c2333;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 48px 16px;
      background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
      color: var(--text);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
      text-align: center;
      animation: rise 0.6s ease-out both;
    }
    svg { overflow: visible; }
    .cloud { fill: var(--surface); filter: drop-shadow(0 8px 18px rgba(84, 113, 191, 0.26)); }
    .cloudFaint { fill: var(--cloud-faint); }
    .bolt { fill: var(--primary); }
    /* 定位交給 <g> 的 transform 屬性，動畫放內層 g（CSS transform 會覆寫屬性 transform） */
    .float { animation: float 5.5s ease-in-out infinite; }
    .driftSlow { animation: drift 13s ease-in-out infinite alternate; }
    .driftSlower { animation: drift 19s ease-in-out infinite alternate-reverse; }
    .flicker { animation: flicker 4s linear infinite; }
    h1 { font-size: 20px; font-weight: 700; }
    p { max-width: 40ch; font-size: 14px; line-height: 1.6; color: var(--text-secondary); }
    a.retry {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      padding: 8px 20px;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
    }
    .brand { position: fixed; bottom: 20px; font-size: 12px; color: var(--text-secondary); opacity: 0.7; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }
    @keyframes drift {
      from { transform: translateX(-12px); }
      to { transform: translateX(12px); }
    }
    /* 閃電：平時常亮，每輪尾端連兩次快閃 */
    @keyframes flicker {
      0%, 62%, 100% { opacity: 0.9; }
      66% { opacity: 0.15; }
      70% { opacity: 1; }
      74% { opacity: 0.25; }
      78%, 92% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      body, .float, .driftSlow, .driftSlower, .flicker { animation: none; }
    }
  </style>
</head>
<body>
  <svg width="260" height="120" viewBox="-130 -60 260 120" role="img" aria-hidden="true">
    <!-- 背景淡雲：兩個深度、不同週期的漂移 -->
    <g transform="translate(-96 -34) scale(0.5)">
      <g class="cloudFaint driftSlow">
        <circle cx="-26" cy="4" r="22"/>
        <circle cx="2" cy="-12" r="28"/>
        <circle cx="30" cy="6" r="20"/>
        <rect x="-40" y="6" width="84" height="20" rx="10"/>
      </g>
    </g>
    <g transform="translate(100 26) scale(0.38)">
      <g class="cloudFaint driftSlower">
        <circle cx="-26" cy="4" r="22"/>
        <circle cx="2" cy="-12" r="28"/>
        <circle cx="30" cy="6" r="20"/>
        <rect x="-40" y="6" width="84" height="20" rx="10"/>
      </g>
    </g>
    <!-- 主雲＋閃電一起浮沉，閃電另外閃爍 -->
    <g class="float">
      <g class="cloud">
        <circle cx="-26" cy="4" r="22"/>
        <circle cx="2" cy="-12" r="28"/>
        <circle cx="30" cy="6" r="20"/>
        <rect x="-40" y="6" width="84" height="20" rx="10"/>
      </g>
      <path class="bolt flicker" d="M 4 2 L -8 20 L 0 20 L -4 36 L 12 16 L 3 16 Z"/>
    </g>
  </svg>
  <h1>發生錯誤</h1>
  <p>請再試一次，如果此錯誤持續發生請聯繫管理員。</p>
  <a class="retry" href="/">重新整理</a>
  <div class="brand">SkyLab</div>
</body>
</html>
