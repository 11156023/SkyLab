<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>SkyLab Connect — 介面提案</title>
  <style>
    *{box-sizing:border-box}
    :root{font-family:"Segoe UI","Microsoft JhengHei",sans-serif;color-scheme:dark;--bg:#101722;--side:#121b29;--panel:#1a2434;--hover:#25334a;--text:#edf2fa;--muted:#a9b7ce;--line:#ffffff14;--brand:#adc2ff;--accent:#5471bf;--green:#77dfb0;--red:#f2a6af;--field:#151f2e}
    body.light{color-scheme:light;--bg:#f4f6fb;--side:#edf1f8;--panel:#fff;--hover:#e8eefb;--text:#263651;--muted:#596b86;--line:#243c6120;--brand:#385aa6;--green:#20764f;--red:#ac3d4e;--field:#fff}
    body{margin:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6}button,input,select{font:inherit}button{cursor:pointer;color:inherit}button:disabled{cursor:not-allowed;color:var(--muted);opacity:.65}button,a,input,select{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand)}a{color:var(--brand)}button{transition:background .15s,border-color .15s}.icon{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.sprite{position:absolute;width:0;height:0;overflow:hidden}.mono{font-family:Consolas,monospace}.muted{color:var(--muted)}.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;flex-shrink:0}.flex{display:flex;align-items:center;gap:8px}.spacer{flex:1}.count{font-size:13px;color:var(--muted)}
    .previewbar{min-height:38px;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--side);color:var(--muted);border-bottom:1px solid var(--line);font-size:13px}.previewbar b{font-weight:500;color:var(--text)}.previewbar select{font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:5px;padding:1px 5px}.shell{min-height:calc(100vh - 38px);display:grid;grid-template-columns:190px minmax(0,1fr);max-width:1440px;margin:auto}.sidebar{padding:28px 16px 20px;border-right:1px solid var(--line);background:var(--side);display:flex;flex-direction:column;position:sticky;top:0;height:calc(100vh - 38px)}.brand{display:flex;align-items:center;gap:10px;padding:0 8px 32px}.brandmark{width:39px;height:39px;background:#eff5ff;border-radius:10px;padding:4px}.brand strong{display:block;font-size:19px;line-height:1.3}.brand small{font-size:12px;color:var(--muted);letter-spacing:.12em}.navitem{display:flex;align-items:center;gap:10px;width:100%;padding:11px 10px;margin:4px 0;border-radius:8px;background:transparent;border:0;text-decoration:none;color:var(--muted);text-align:left;font-size:14px;white-space:nowrap}.navitem:hover{background:var(--hover);color:var(--text)}.navitem.active{background:#7899ee18;color:var(--brand)}.sidebarbottom{margin-top:auto;padding-top:28px}.profile{display:flex;align-items:center;gap:10px;padding:18px 8px 0;margin-top:14px;border-top:1px solid var(--line)}.avatar{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--hover);color:var(--brand)}.profile strong{font-size:14px;font-weight:600}.profile small{font-size:13px;color:var(--muted);display:block}.profile>.icon{display:none}
    .workspace{min-width:0}.content{padding:28px 30px 20px;max-width:1160px;margin:auto}.heading{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.heading h1{font-size:28px;letter-spacing:-.03em;margin:0;font-weight:650}.heading-actions{display:flex;align-items:center;gap:10px}.iconbtn{border:1px solid var(--line);background:transparent;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;flex-shrink:0}.iconbtn:hover{background:var(--hover)}.button{border:1px solid var(--line);border-radius:8px;padding:8px 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:transparent;font-size:14px;white-space:nowrap;min-height:40px}.button:hover:not(:disabled){background:var(--hover);border-color:#88a8ee60}.button.primary{color:#fff;background:var(--accent);border-color:transparent}.button.primary:hover:not(:disabled){background:#4666b4}.button.quiet{color:var(--muted)}
    .connection{display:flex;align-items:center;gap:12px;min-height:68px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:24px}.shield{color:var(--green);display:grid;place-items:center;flex-shrink:0}.shield .icon{width:23px;height:23px}.connection h2{font-size:16px;font-weight:500;margin:0}.connection p{color:var(--muted);margin:4px 0 0;font-size:14px}.connection[data-state="connected"] p{display:none}.connection-actions{margin-left:auto;flex-shrink:0}.connection[data-state="error"]{border-color:#ee9ba455}.connection[data-state="error"] .shield{color:var(--red)}.connection[data-state="offline"] .shield,.connection[data-state="connecting"] .shield{color:var(--brand)}
    .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:24px}.tabs{display:flex;gap:14px}.tab{border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);padding:8px 0;font-size:14px;display:flex;align-items:center;gap:5px;white-space:nowrap}.tab.active{border-color:var(--brand);color:var(--text)}.tab span{font-size:13px;color:var(--muted)}.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:8px 10px;max-width:205px;min-width:135px;margin-left:auto}.search .icon{width:17px;color:var(--muted)}.search input{background:none;border:0;color:var(--text);min-width:0;width:100%;font-size:14px}.search input::placeholder{color:var(--muted)}.views{display:flex;gap:2px}.views button{border:0;background:transparent;color:var(--muted);width:36px;height:40px;border-radius:6px;display:grid;place-items:center}.views button.active{background:var(--hover);color:var(--brand)}
    .group{margin-bottom:24px}.grouphead{display:flex;align-items:center;gap:10px;margin-bottom:12px}.grouphead h2{font-size:15px;font-weight:500;margin:0}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{min-width:0;border:1px solid var(--line);border-radius:11px;background:var(--panel);padding:20px}.machine-state{color:var(--green);font-size:13px;display:flex;align-items:center;gap:7px;margin-bottom:6px}.card h3{font-size:17px;margin:0;font-weight:600;overflow-wrap:anywhere;line-height:1.5}.address{font:15px/1.6 Consolas,monospace;color:var(--muted);margin:10px 0 18px}.cardactions{display:flex;gap:10px}.cardactions .launch{flex:1;background:#7899ee13;border-color:#9cb9ff35;color:var(--brand)}.cardactions .launch:hover:not(:disabled){background:#7899ee28}.cardactions .iconbtn{border-color:transparent;color:var(--muted)}.expired{display:flex;align-items:center;gap:16px;padding:18px 20px;background:var(--panel);border:1px solid var(--line);border-radius:10px}.expired h3{font-size:16px;font-weight:500;margin:0;overflow-wrap:anywhere}.expired .meta{font-size:14px;color:var(--muted);margin-top:3px}.expired .end{margin-left:auto;font-size:14px;color:var(--red);white-space:nowrap}.expired .iconbtn{color:var(--muted);border:0}.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}.footer{padding-top:2px;display:flex;align-items:center;color:var(--muted);font-size:13px}.footer button{font-size:13px;border:0;background:none;color:var(--muted);padding:0}.footer button:hover{color:var(--brand)}
    .list .cards{grid-template-columns:1fr}.list .card{display:grid;grid-template-columns:minmax(0,1fr) 140px 170px;align-items:center;gap:16px;padding:16px 18px}.list .address{margin:0}.list .card h3{font-size:16px}.list .cardactions{gap:4px}
    dialog{color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(520px,calc(100vw - 36px));padding:0;box-shadow:0 30px 100px #0008}dialog::backdrop{background:#060d18b8;backdrop-filter:blur(3px)}.modalhead{display:flex;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line)}.modalhead h2{font-size:20px;margin:0}.modalbody{padding:22px}.modalbody p{color:var(--muted);font-size:15px;line-height:1.8;margin:0 0 16px}.modalbody label{display:block;font-size:14px;margin:18px 0 8px}.modalbody input,.modalbody select{border:1px solid var(--line);border-radius:8px;width:100%;padding:10px;background:var(--field);color:var(--text);font-size:15px}.modalfoot{padding:16px 22px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line)}.command{padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--text);font:15px/1.8 Consolas,monospace;overflow:auto}.detailrow{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.detailrow>span:last-child{text-align:right;overflow-wrap:anywhere;min-width:0}.detailrow+p{margin-top:18px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);padding:12px 18px;border:1px solid var(--line);background:var(--hover);color:var(--text);box-shadow:0 8px 35px #0004;border-radius:10px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:10;font-size:14px;max-width:90vw}.toast.show{transform:translate(-50%,0);opacity:1}.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:1100px){.shell{grid-template-columns:170px minmax(0,1fr)}.sidebar{padding:24px 12px 20px}.brand{padding-left:2px}.content{padding:24px}.toolbar{gap:10px}.tabs{gap:12px}.search{max-width:170px}.list .card{grid-template-columns:minmax(0,1fr) 140px;gap:10px}.list .address{grid-column:1;grid-row:2}.list .cardactions{grid-column:2;grid-row:1 / span 2}.list .card h3{font-size:17px}}
    @media(max-width:780px){.shell{grid-template-columns:68px minmax(0,1fr)}.sidebar{padding:24px 10px}.brand{padding:0 4px 28px}.brandmark{width:38px;height:38px}.brand div,.navtext,.profile{display:none}.navitem{justify-content:center;padding:12px}.content{padding:22px 18px}.toolbar{flex-wrap:wrap}.search{max-width:none;flex:1}.cards{grid-template-columns:1fr}.previewbar{gap:8px}.previewbar>span{display:none}.connection{align-items:flex-start}.connection-actions{align-self:center}.connection p{max-width:270px}.expired{flex-wrap:wrap}.expired .end{margin-left:0}.expired .iconbtn{margin-left:auto}}
    @media(max-width:570px){.heading h1{font-size:26px}.heading #refresh span{display:none}.heading #refresh{padding:8px 10px}.heading-actions{gap:6px}.tabs{width:100%;gap:20px}.search{margin-left:0}.connection{flex-wrap:wrap}.connection-actions{margin-left:35px}.card{padding:18px}.content{padding:20px 14px}.list .card{grid-template-columns:1fr}.list .address,.list .cardactions{grid-column:auto;grid-row:auto}.expired h3{font-size:16px}}
    @media(max-height:700px) and (min-width:781px){.content{padding-top:20px}.heading,.connection,.toolbar,.group{margin-bottom:20px}.card{padding:18px}.address{margin:8px 0 16px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<svg class="sprite" xmlns="http://www.w3.org/2000/svg"><defs>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4M8 8l3 3-3 3m5 0h3"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3m6 0h4"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 4-5 8-8 9-3-1-8-5-8-9V6z"/><path d="m8 12 3 3 5-6"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3-1 3-3 1-2 4 2 3v3l4 3 3-1 3 1 4-3v-3l2-3-2-4-3-1-1-3z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 8a8 8 0 0 0-14-3L3 8m0-5v5h5m-4 8a8 8 0 0 0 14 3l3-3m0 5v-5h-5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 5h12M9 12h12M9 19h12M3 5h1M3 12h1M3 19h1"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 5C9 3 6 3 3 4v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1zm0 0v15"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 3h7v7m0-7L10 14m0-9H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1 1m12 12 1 1M5 19l1-1M18 6l1-1"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/></symbol>
  <symbol id="i-activity" viewBox="0 0 24 24"><path d="M2 12h4l3-8 6 16 3-8h4"/></symbol>
</defs></svg>
<div class="previewbar"><b>介面預覽</b><span>模擬資料</span><label for="scenario">狀態</label><select id="scenario"><option value="connected">已連線</option><option value="offline">尚未連線</option><option value="connecting">連線中</option><option value="error">連線失敗</option></select></div>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><img class="brandmark" src="./logo.png" alt="SkyLab"><div><strong>SkyLab</strong><small>CONNECT</small></div></div>
    <button class="navitem active" id="nav-resources"><svg class="icon"><use href="#i-grid"/></svg><span class="navtext">我的資源</span></button>
    <button class="navitem" id="nav-connection"><svg class="icon"><use href="#i-activity"/></svg><span class="navtext">連線資訊</span></button>
    <a class="navitem" href="https://skylab-tw.com" target="_blank" rel="noopener"><svg class="icon"><use href="#i-external"/></svg><span class="navtext">開啟 Web 平台</span></a>
    <div class="sidebarbottom"><button class="navitem" id="settings"><svg class="icon"><use href="#i-settings"/></svg><span class="navtext">偏好設定</span></button><div class="profile"><div class="avatar">R</div><div><strong>Ray</strong><small>示範帳號</small></div><svg class="icon"><use href="#i-shield"/></svg></div></div>
  </aside>
  <div class="workspace">
    <main class="content">
      <div class="heading"><h1>我的資源</h1><div class="heading-actions"><button class="button" id="refresh"><svg class="icon"><use href="#i-refresh"/></svg><span>重新整理</span></button><button class="iconbtn" id="theme" aria-label="切換明暗主題" title="切換明暗主題"><svg class="icon"><use href="#i-sun"/></svg></button></div></div>
      <section class="connection" id="connection" data-state="connected" aria-label="連線狀態"><div class="shield"><svg class="icon"><use href="#i-shield"/></svg></div><div><h2 id="connection-title">已安全連線</h2><p id="connection-description"></p></div><div class="connection-actions"><button class="button quiet" id="connect">中斷連線</button></div></section>
      <div class="toolbar"><div class="tabs" role="tablist" aria-label="資源來源"><button class="tab active" role="tab" aria-selected="true" data-filter="all">全部資源 <span>3</span></button><button class="tab" role="tab" aria-selected="false" data-filter="course">課程環境 <span>2</span></button><button class="tab" role="tab" aria-selected="false" data-filter="personal">個人資源 <span>1</span></button></div><label class="search"><svg class="icon"><use href="#i-search"/></svg><input id="search" aria-label="搜尋機器" placeholder="搜尋名稱或 IP…"></label><div class="views" aria-label="顯示方式"><button class="active" id="grid-view" aria-label="卡片檢視" aria-pressed="true"><svg class="icon"><use href="#i-grid"/></svg></button><button id="list-view" aria-label="列表檢視" aria-pressed="false"><svg class="icon"><use href="#i-list"/></svg></button></div></div>
      <div id="resources"></div>
      <footer class="footer"><span id="updated">3 台資源</span><span class="spacer"></span><button id="help">連線協助</button></footer>
    </main>
  </div>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="modalhead"><svg class="icon"><use id="dialog-icon" href="#i-info"/></svg><h2 id="dialog-title"></h2><div class="spacer"></div><button class="iconbtn" id="close-dialog" aria-label="關閉"><svg class="icon"><use href="#i-close"/></svg></button></div><div class="modalbody" id="dialog-body"></div><div class="modalfoot" id="dialog-footer"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
  const $ = s => document.querySelector(s);
  const icon = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
  const machines = [{id:205,name:'practice-0ac786-lxc-1',ip:'192.168.60.105',label:'LXC 1'},{id:204,name:'practice-0ac786-lxc-2',ip:'192.168.60.106',label:'LXC 2'}];
  let filter = 'all', state = 'connected', view = 'grid', connectTimer, toastTimer;
  const dialog = $('#dialog');
  const escapeHtml = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  function toast(message){$('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3200)}
  function modal(title,body,footer='',glyph='info'){ $('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;$('#dialog-footer').innerHTML=footer||'<button class="button" data-close>關閉</button>';$('#dialog-icon').setAttribute('href','#i-'+glyph);dialog.showModal();dialog.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>dialog.close()) }
  $('#close-dialog').onclick=()=>dialog.close();dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close()}});
  function render(){
    const query=$('#search').value.trim().toLowerCase();
    const rows=machines.filter(m=>`${m.name} ${m.ip} ${m.id} skylab 課程活動 環境`.toLowerCase().includes(query));
    let html='';
    if(filter!=='personal'&&rows.length){html+=`<section class="group"><div class="grouphead"><h2>SkyLab 課程活動環境</h2><span class="count">${rows.length} 台</span></div><div class="cards">`+rows.map(m=>`<article class="card"><div class="cardtop"><div class="machine-state"><i class="dot"></i>執行中</div><h3>${m.name}</h3></div><div class="address" aria-label="內網 IP">${m.ip}</div><div class="cardactions"><button class="button launch" data-ssh="${m.id}" ${state!=='connected'?'disabled':''}>${icon('terminal')}${state==='connected'?'SSH 連線':'等待安全連線'}</button><button class="iconbtn" data-info="${m.id}" aria-label="${m.name} 詳情" title="機器詳情">${icon('info')}</button></div></article>`).join('')+'</div></section>'}
    if(filter!=='course'&&`i-really-need-free-vm 192.168.60.104 203`.includes(query)){html+=`<section class="group"><div class="grouphead"><h2>個人資源</h2><span class="count">1 台</span></div><article class="expired"><div><h3>i-really-need-free-vm</h3><div class="meta">已停止</div></div><div class="end">使用時段已結束</div><button class="iconbtn" data-info="203" aria-label="已到期機器詳情" title="機器詳情">${icon('info')}</button></article></section>`}
    $('#resources').innerHTML=html||'<div class="empty">找不到符合條件的機器<br><small>試試其他名稱、IP 或資源分類。</small></div>';
    $('#resources').classList.toggle('list',view==='list');
    document.querySelectorAll('[data-ssh]').forEach(b=>b.onclick=()=>openSsh(machines.find(m=>m.id===Number(b.dataset.ssh))));
    document.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>info(Number(b.dataset.info)));
  }
  function openSsh(machine){if(state!=='connected')return;modal('SSH 連線',`<p>連線到 <strong>${machine.name}</strong>。正式版會呼叫本機終端機；此提案僅預覽操作畫面。</p><label for="ssh-user">登入帳號</label><input id="ssh-user" value="root" autocomplete="off" spellcheck="false"><label>連線指令</label><div class="command" id="ssh-command">ssh root@${machine.ip}</div>`,`<button class="button" data-close>關閉</button><button class="button primary" id="copy-command">${icon('copy')}複製指令</button>`,'terminal');$('#ssh-user').oninput=()=>{const user=$('#ssh-user').value.trim();$('#ssh-command').textContent=/^[a-zA-Z0-9_][a-zA-Z0-9_.-]*\$?$/.test(user)?`ssh ${user}@${machine.ip}`:'請輸入有效的 SSH 帳號';$('#copy-command').disabled=!/^[a-zA-Z0-9_][a-zA-Z0-9_.-]*\$?$/.test(user)};$('#copy-command').onclick=async()=>{try{await navigator.clipboard.writeText($('#ssh-command').textContent);toast('已複製 SSH 指令')}catch{toast('無法存取剪貼簿，請選取指令手動複製')}}}
  function info(id){const machine=machines.find(m=>m.id===id);modal('機器詳情',`<div class="detailrow"><span class="muted">名稱</span><span>${machine?machine.name:'i-really-need-free-vm'}</span></div><div class="detailrow"><span class="muted">內網 IP</span><span class="mono">${machine?machine.ip:'192.168.60.104'}</span></div><div class="detailrow"><span class="muted">VMID</span><span>${id}</span></div><div class="detailrow"><span class="muted">環境／系統</span><span>LXC · Ubuntu 25.04</span></div><div class="detailrow"><span class="muted">使用權限</span><span>${machine?'依課程開放時間':'已於 2026/09/30 到期'}</span></div><p>${machine?'請先建立安全連線，再透過 SSH 使用機器。':'此機器已到期並停止，無法再建立連線。可前往 Web 平台查看申請資訊。'}</p>`)}
  function setState(next){clearTimeout(connectTimer);state=next;$('#scenario').value=next;$('#connection').dataset.state=next;const values={connected:['已安全連線','','中斷連線','已連線','WireGuard'],offline:['連接你的 SkyLab 工作空間','建立安全連線後，即可透過 SSH 存取機器。','開始連線','未連線','WireGuard'],connecting:['正在建立安全連線','正在與 Gateway 交握，請稍候。','取消連線','連線中','連線中'],error:['無法建立安全連線','Gateway 尚未回應，請檢查網路後再試一次。','重新連線','連線失敗','需要處理']}[next];$('#connection-title').textContent=values[0];$('#connection-description').textContent=values[1];$('#connect').textContent=values[2];$('#connect').className='button '+(next==='connected'?'quiet':'primary');$('#connection .shield .icon').classList.toggle('spin',next==='connecting');render()}
  $('#scenario').onchange=e=>setState(e.target.value);
  $('#connect').onclick=()=>{if(state==='connected'||state==='connecting'){setState('offline');return}setState('connecting');connectTimer=setTimeout(()=>{setState('connected');toast('示範：安全連線已建立')},1800)};
  document.querySelectorAll('[data-filter]').forEach(button=>button.onclick=()=>{filter=button.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>{b.classList.toggle('active',b===button);b.setAttribute('aria-selected',String(b===button))});render()});
  $('#search').oninput=render;
  for(const mode of ['grid','list'])$('#'+mode+'-view').onclick=()=>{view=mode;for(const m of ['grid','list']){$('#'+m+'-view').classList.toggle('active',m===mode);$('#'+m+'-view').setAttribute('aria-pressed',String(m===mode))}render()};
  $('#theme').onclick=()=>document.body.classList.toggle('light');
  $('#refresh').onclick=()=>{const button=$('#refresh');button.disabled=true;button.querySelector('.icon').classList.add('spin');setTimeout(()=>{button.disabled=false;button.querySelector('.icon').classList.remove('spin');$('#updated').textContent='剛剛更新';toast('示範資源已重新整理')},700)};
  $('#nav-resources').onclick=()=>{filter='all';$('#search').value='';document.querySelector('[data-filter="all"]').click()};
  $('#nav-connection').onclick=()=>modal('連線資訊',`<p>此處為設計預覽，以下數值皆為示範資料。</p><div class="detailrow"><span class="muted">連線狀態</span><span>${escapeHtml($('#connection-title').textContent)}</span></div><div class="detailrow"><span class="muted">通訊協定</span><span>WireGuard</span></div><div class="detailrow"><span class="muted">Tunnel IP</span><span class="mono">10.250.0.2</span></div><div class="detailrow"><span class="muted">Gateway</span><span class="mono">211.75.1.200:51821</span></div><div class="detailrow"><span class="muted">允許存取</span><span>2 台機器 · SSH</span></div>`,null,'shield');
  $('#settings').onclick=()=>{modal('偏好設定',`<p>讓 SkyLab Connect 更貼近你的工作方式。</p><label for="theme-choice">外觀</label><select id="theme-choice"><option value="dark">深色</option><option value="light">亮色</option></select><label for="backend-url">後端網址</label><input id="backend-url" value="https://skylab-tw.com" readonly><p>此提案僅供介面預覽，設定不會修改正式 APP。</p>`,`<button class="button primary" data-close>完成</button>`,'settings');$('#theme-choice').value=document.body.classList.contains('light')?'light':'dark';$('#theme-choice').onchange=e=>document.body.classList.toggle('light',e.target.value==='light')};
  $('#help').onclick=()=>modal('連線協助','<p>先確認安全連線已建立，再選擇執行中的機器。已停止或已到期的機器無法連線。</p><p>若 Gateway 沒有回應，可檢查目前網路並重試。正式版可在「連線資訊」檢視診斷紀錄。</p><p>這是互動設計提案，不會建立實際 VPN 或 SSH 連線。</p>');
  render();
</script>
</body>
</html>
