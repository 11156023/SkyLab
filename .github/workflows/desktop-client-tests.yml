name: Desktop Client Tests

on:
  pull_request:
    paths:
      - "desktop-client/**"
      - ".github/workflows/desktop-client-tests.yml"
  push:
    branches: [main]
    paths:
      - "desktop-client/**"
      - ".github/workflows/desktop-client-tests.yml"

concurrency:
  group: desktop-client-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint + audit + build
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop-client

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test tunnel lifecycle
        run: npm run test:tunnel

      - name: Audit dependencies
        run: npm run audit:security

      - name: Production build
        run: npm run build
