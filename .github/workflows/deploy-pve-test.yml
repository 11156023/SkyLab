name: Deploy to PVE Test

# 只允許手動觸發（Actions 頁面 → Run workflow），push 到 main 不會自動部署。
# 絕對不要加 push / pull_request / pull_request_target —— 這個 workflow 跑在
# self-hosted runner 上，自動觸發等於讓程式碼未經人工確認就在內網機器執行。
on:
  workflow_dispatch:

# 同一時間只允許一個部署，且不中斷進行中的部署
concurrency:
  group: deploy-pve-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to PVE test environment
    # 防止其他 fork 收錄此檔後誤觸發（它們沒有掛 skylab-main runner，
    # job 會無限排隊）
    if: github.repository == 'ntubclass/SkyLab'
    # 只派給掛有 skylab-main 自訂 label 的 self-hosted runner。
    # 注意：GitHub 不會把 runner 名稱當 label，新 runner 註冊時要用
    # --labels skylab-main（或到 Settings → Actions → Runners 補加）。
    runs-on: skylab-main
    # 綁定 pve-test environment：required reviewers 會擋在 job 開始前，
    # 管理者在 Actions 頁面按下 Approve 才會真正部署
    environment: pve-test
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install configuration preflight dependencies
        run: |
          python3 -m venv vllm-service/.runtime/deploy-venv
          vllm-service/.runtime/deploy-venv/bin/pip install 'PyYAML>=6.0' 'python-dotenv>=1.2.2'

      - name: Fill missing AI gateway secrets
        # 只補 /opt/skylab 兩份 .env 中缺少或仍為範例值的 LiteLLM master／salt／DB
        # 密碼與 Campus service key（寫回 /opt/skylab 才能跨次部署保留）；既有真實值
        # 一律不動，什麼都不缺時不寫檔。上游 vLLM 金鑰無法產生，缺少時在此失敗。
        run: |
          AI_STACK_PYTHON="$PWD/vllm-service/.runtime/deploy-venv/bin/python" bash scripts/prepare-ai-stack.sh --init-env \
            --root-env /opt/skylab/.env \
            --gateway-env /opt/skylab/vllm-service/litellm/.env \
            --engine-env /opt/skylab/vllm-service/.env.API

      - name: Load deployment configuration
        # 機密與模型路由放在 runner VM 的 /opt/skylab，不進 repo。
        run: |
          install -m 600 /opt/skylab/.env .env
          install -m 600 /opt/skylab/vllm-service/litellm/.env vllm-service/litellm/.env
          install -m 600 /opt/skylab/vllm-service/models.json vllm-service/models.json
          if [ -f /opt/skylab/vllm-service/.env.API ]; then
            install -m 600 /opt/skylab/vllm-service/.env.API vllm-service/.env.API
          fi

      - name: Deploy
        # 建立 LiteLLM 專用 DB（db:5432）、啟動 gateway、核發／同步 Campus service key，
        # 再啟動主 Compose。Refuse to compete with an existing standalone gateway;
        # start no GPU engine.
        env:
          # 前端「關於」分頁顯示的 commit（build context 沒有 .git）
          SOURCE_COMMIT: ${{ github.sha }}
        run: AI_STACK_PYTHON="$PWD/vllm-service/.runtime/deploy-venv/bin/python" bash scripts/prepare-ai-stack.sh --start

      - name: Smoke test
        run: |
          for i in {1..30}; do
            if docker compose exec -T backend curl -fsS http://localhost:8000/api/v1/utils/health-check/ && curl -fsS http://localhost:4000/health/readiness; then
              echo "Backend and LiteLLM healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time"
          docker compose logs --tail 50 backend
          exit 1

      - name: Smoke test every public AI model
        id: ai_api_smoke
        # Model readiness is observed after deployment. A failed model check
        # must be visible as a warning without turning an otherwise completed
        # deployment into a failed deploy job.
        continue-on-error: true
        # Use the normal request/review flow to create a temporary, dedicated
        # ccai_* smoke credential after cleaning up previous runs. The optional variable
        # is the Campus API root ending in /api/v1; otherwise use the published
        # backend port from this deployment.
        env:
          CONFIGURED_AI_API_PUBLIC_BASE_URL: ${{ vars.AI_API_PUBLIC_BASE_URL }}
        run: |
          set +x
          umask 077
          smoke_dir="$(mktemp -d)"
          container_smoke_dir=""
          cleanup_smoke_files() {
            rm -rf -- "$smoke_dir"
            if [[ -n "$container_smoke_dir" ]]; then
              docker compose exec -T backend rm -rf -- "$container_smoke_dir"
            fi
          }
          trap cleanup_smoke_files EXIT
          container_smoke_dir="$(docker compose exec -T backend mktemp -d)"
          docker compose exec -T backend \
            python -m scripts.ensure_ai_api_smoke_credential \
            --output "$container_smoke_dir/key"
          docker compose cp "backend:$container_smoke_dir/key" "$smoke_dir/key"
          AI_API_SMOKE_KEY="$(<"$smoke_dir/key")"
          cleanup_smoke_files
          container_smoke_dir=""
          if [[ ! "$AI_API_SMOKE_KEY" =~ ^ccai_[A-Za-z0-9_-]+$ ]]; then
            echo "::warning::Unable to create or recover the deployment smoke credential; deployment remains active."
            exit 1
          fi
          echo "::add-mask::$AI_API_SMOKE_KEY"
          export AI_API_SMOKE_KEY
          if [[ -n "$CONFIGURED_AI_API_PUBLIC_BASE_URL" ]]; then
            export AI_API_PUBLIC_BASE_URL="$CONFIGURED_AI_API_PUBLIC_BASE_URL"
          else
            backend_address="$(docker compose port backend 8000 | tail -n 1)"
            backend_port="${backend_address##*:}"
            if [[ ! "$backend_port" =~ ^[0-9]+$ ]]; then
              echo "Unable to resolve the published backend port"
              exit 1
            fi
            export AI_API_PUBLIC_BASE_URL="http://127.0.0.1:${backend_port}/api/v1"
          fi
          bash scripts/verify-ai-api-cutover.sh

      - name: Warn about public AI model smoke failures
        if: ${{ steps.ai_api_smoke.outcome == 'failure' }}
        run: |
          echo "::warning title=Public AI model smoke test::One or more public AI models failed smoke validation; deployment remains active. Review the smoke output above."

      - name: Delete deployment smoke credentials
        if: ${{ always() && steps.ai_api_smoke.outcome != 'skipped' }}
        # Run even when credential creation or a model check fails. Keys with
        # usage records are revoked to preserve accounting; unused keys are deleted.
        run: docker compose exec -T backend python -m scripts.ensure_ai_api_smoke_credential --cleanup

      - name: Cleanup dangling images
        if: always()
        run: docker image prune -f
