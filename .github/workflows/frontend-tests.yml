name: Frontend Tests

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: jobs only need to read repo contents
permissions:
  contents: read

jobs:
  vitest:
    name: vitest + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        # Use the workspace-root lockfile so CI cannot resolve a newly
        # published transitive version during a registry propagation window.
        # Bun selects ../bun.lock when invoked from this workspace directory;
        # it still installs the platform-specific optional packages needed on
        # the Linux runner.
        run: bun install --frozen-lockfile

      - name: Run vitest
        run: bunx vitest run

      - name: Production build
        # `bun run build` runs `vite build`
        run: bun run build

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: ignore

  # Summary job — name must match the required status check in branch protection
  ci-pass:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [vitest]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed"
