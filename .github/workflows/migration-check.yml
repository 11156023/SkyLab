name: Migration sanity

on:
  push:
    branches: [main]
    paths:
      - "backend/app/models/**"
      - "backend/app/alembic/**"
      - "backend/scripts/check-migrations.sh"
  pull_request:
    paths:
      - "backend/app/models/**"
      - "backend/app/alembic/**"
      - "backend/scripts/check-migrations.sh"

# Least privilege: jobs only need to read repo contents
permissions:
  contents: read

jobs:
  check-migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          cache-dependency-path: uv.lock

      - name: Sync backend deps
        run: uv sync --frozen

      - name: Run migration check
        env:
          PROJECT_NAME: SkyLab-ci
          FIRST_SUPERUSER: admin@example.com
          FIRST_SUPERUSER_PASSWORD: ci-migration-check-password
          SECRET_KEY: ci-migration-check-secret-key-not-for-production
          ENVIRONMENT: local
        run: bash scripts/check-migrations.sh
