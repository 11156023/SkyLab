name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # 🔥 突破盲腸：用括號將「身分群組」與「指令群組」分開，並用 && 連接
    if: |
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode'))
       
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false

    # 只給留言與 PR 寫入權；不需要 contents: write / id-token
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfb # v4.2.2

      # 第三方 action 一律釘 commit SHA，不用可變 tag（@latest 等於把 repo 寫入權交給上游）
      - name: Run opencode
        uses: anomalyco/opencode/github@fe3f3a41f79ad292cc3c7c629567385a20ec5130 # v1.18.32
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }} # 確保你有在 Repo 的 Settings -> Secrets 裡設定這個 Key
        with:
          model: opencode/deepseek-v4-pro