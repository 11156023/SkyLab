# SkyLab — Docker Compose

x-backend-env: &backend-env
  DOMAIN: ${DOMAIN}
  FRONTEND_HOST: ${FRONTEND_HOST?Variable not set}
  ENVIRONMENT: ${ENVIRONMENT}
  ENABLE_SIGNUP: ${ENABLE_SIGNUP:-true}
  BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
  SECRET_KEY: ${SECRET_KEY?Variable not set}
  FIRST_SUPERUSER: ${FIRST_SUPERUSER?Variable not set}
  FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD?Variable not set}
  SMTP_HOST: ${SMTP_HOST:-mailcatcher}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_TLS: ${SMTP_TLS:-false}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-noreply@example.com}
  # 應用程式一律經 PgBouncer（transaction pooling）連 DB；prestart 的 alembic
  # 例外，直連 db（見 prestart 服務的 environment 覆寫）。
  POSTGRES_SERVER: pgbouncer
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER?Variable not set}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}
  REDIS_ENABLED: ${REDIS_ENABLED:-true}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  PROXMOX_HOST: ${PROXMOX_HOST}
  PROXMOX_USER: ${PROXMOX_USER}
  PROXMOX_PASSWORD: ${PROXMOX_PASSWORD}
  PROXMOX_VERIFY_SSL: ${PROXMOX_VERIFY_SSL:-false}
  PROXMOX_ISO_STORAGE: ${PROXMOX_ISO_STORAGE}
  PROXMOX_DATA_STORAGE: ${PROXMOX_DATA_STORAGE}
  SENTRY_DSN: ${SENTRY_DSN}
  # 容器內預設輸出 JSON 日誌（docker logs 不帶 ANSI 色碼；監控 stack 的 Loki 靠它
  # 解析 level／request_id）。.env 明確設 LOG_JSON=false 時照舊。
  LOG_JSON: ${LOG_JSON:-true}

# 容器日誌（docker logs）一律限制大小並輪替：預設 json-file driver 不輪替，
# 長時間跑下來會把 /var/lib/docker 撐爆。應用程式自己的 logs/*.log 另有輪替。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"


services:

  # -------------------------
  # Nginx Reverse Proxy
  # -------------------------
  nginx:
    # default.conf 的 upstream 用 `resolve` 動態解析容器名，需要 nginx OSS ≥ 1.27.3
    image: nginx:1.31-alpine
    logging: *default-logging
    restart: unless-stopped
    ports:
      # 對外入口預設 8082：rootless Docker（例如 self-hosted runner 的部署機）
      # 綁不了 1024 以下的特權 port；需要 80 時在 .env 設 NGINX_HOST_PORT=80。
      - "${NGINX_HOST_PORT:-8082}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - skylab
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # -------------------------
  # PostgreSQL
  # -------------------------
  db:
    image: postgres:18
    logging: *default-logging
    restart: always
    # backend／worker 都經 PgBouncer 連進來（server 端最多 MAX_DB_CONNECTIONS），
    # 再加 prestart、adminer 等直連工具；200 留有餘裕。
    # 記憶體參數：官方映像預設 shared_buffers 只有 128MB，多人同時查機器列表／
    # 稽核日誌時 cache 命中率很差。effective_cache_size 只是給 planner 的提示，
    # 不會真的配置記憶體；work_mem 是每個排序／hash 節點各自的上限。
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
    ports:
      # Bind to localhost only: reachable for on-host tooling, never from the
      # public network. Inter-container access uses the `db` service DNS name.
      # 5432 is commonly occupied by an on-host PostgreSQL instance.  Keep
      # the container's internal service port unchanged and expose 5433 only
      # for local administration; Campus containers always use db:5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - skylab

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # -------------------------
  # PgBouncer（連線池）
  # -------------------------
  # backend 的 SQLAlchemy pool 上限 50、worker 再一份，直接打 Postgres 很快就
  # 撞 max_connections；PgBouncer 以 transaction pooling 把幾百條客戶端連線
  # 收斂成幾十條 server 連線。程式碼層的配合：
  #   - advisory lock 一律用 *_xact_* 版本（交易結束自動釋放，不會殘留在
  #     回到池裡的 server 連線上）
  #   - 不用 SET／LISTEN／temp table 等跨交易的 session 狀態
  #   - psycopg 3 的 server-side prepared statement 由 MAX_PREPARED_STATEMENTS
  #     承接（PgBouncer ≥ 1.21）
  #   - alembic migration 走 prestart 直連 db
  pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    logging: *default-logging
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER?Variable not set}
      DB_PASSWORD: ${POSTGRES_PASSWORD?Variable not set}
      # Postgres 18 預設 scram-sha-256；這個映像在 scram 模式下把明文密碼
      # 寫進 userlist，同時用於客戶端登入與對 server 的登入。
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 10
      RESERVE_POOL_TIMEOUT: 3
      MAX_DB_CONNECTIONS: 150
      MAX_PREPARED_STATEMENTS: 200
      SERVER_IDLE_TIMEOUT: 300
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
    depends_on:
      db:
        condition: service_healthy
    networks:
      - skylab
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------
  # Redis
  # -------------------------
  redis:
    image: redis:7-alpine
    logging: *default-logging
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Localhost only — Redis has no auth; must never be exposed externally.
      - "127.0.0.1:6379:6379"
    volumes:
      - app-redis-data:/data
    networks:
      - skylab

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------
  # Mailcatcher
  # -------------------------
  mailcatcher:
    image: schickling/mailcatcher
    logging: *default-logging
    # SMTP_HOST 預設就是 mailcatcher（見 x-backend-env），所以它必須跟著起來；
    # 正式環境在 .env 設真正的 SMTP_HOST 後，這個容器只是閒置，不對外暴露。
    restart: unless-stopped
    ports:


      # Dev-only mail sink — bind to localhost so captured mail (incl. password
      # reset links) is not readable from the public network. Replace with a
      # real SMTP (set SMTP_HOST/SMTP_* in .env) before a real production run.
      - "127.0.0.1:1080:1080"
      - "127.0.0.1:1025:1025"
    networks:
      - skylab

  # -------------------------
  # Prestart
  # -------------------------
  prestart:
    image: '${DOCKER_IMAGE_BACKEND}:${TAG-latest}'
    logging: *default-logging
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: bash scripts/prestart.sh
    env_file:
      - .env
    environment:
      <<: *backend-env
      # migration（DDL、長交易）不經連線池，直連 Postgres
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - skylab

  # -------------------------
  # Backend (FastAPI)
  # -------------------------
  backend:
    image: '${DOCKER_IMAGE_BACKEND}:${TAG-latest}'
    logging: *default-logging
    build:
      context: .
      dockerfile: backend/Dockerfile
    # 不覆寫 command：沿用 Dockerfile 的 `fastapi run --workers 1`。
    # 這個服務沒有掛程式碼 volume，先前的 --reload 只是多一個 watcher 行程
    # 盯著映像內不會變的檔案；本機開發請直接跑 `fastapi dev app/main.py`。
    restart: unless-stopped
    ports:
      # Localhost only: the public entry point is nginx (:80), which proxies
      # /api and /ws to this service over the internal network. Exposing 8000
      # externally would let callers bypass nginx and forge X-Forwarded-For.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      <<: *backend-env
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      prestart:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5
    # The independently deployed LiteLLM gateway uses host networking so it
    # can reach vLLM instances bound to 127.0.0.1:8103/8104.  Keep this host
    # gateway mapping for the future AI_API_BASE_URL connection.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - skylab

  # -------------------------
  # Worker (arq 任務隊列)
  # -------------------------
  worker:
    image: '${DOCKER_IMAGE_BACKEND}:${TAG-latest}'
    logging: *default-logging
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - arq
      - app.infrastructure.queue.worker.WorkerSettings
    env_file:
      - .env
    environment:
      <<: *backend-env
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      prestart:
        condition: service_completed_successfully
    restart: unless-stopped
    # arq worker 每 60 秒把 health check key 寫進 Redis（TTL 61 秒）；key 不在
    # 就是 worker 卡死或沒在跑。刻意不用 `arq --check`：那會 import 全部任務模組，
    # 每次檢查都吃好幾秒與上百 MB。
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, sys, redis; r = redis.Redis.from_url(os.environ.get('REDIS_URL', 'redis://redis:6379/0'), socket_timeout=3); sys.exit(0 if r.exists('skylab:tasks:health-check') else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - skylab

  # -------------------------
  # Frontend
  # -------------------------
  frontend:
    image: '${DOCKER_IMAGE_FRONTEND:-frontend}:${TAG-latest}'
    logging: *default-logging
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        ENABLE_SIGNUP: ${ENABLE_SIGNUP:-true}
        # 前端 Sentry（瀏覽器端錯誤）；留空＝不載入 SDK
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${ENVIRONMENT:-local}
        VITE_SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    ports:
      # Localhost only — public traffic goes through nginx (:80).
      # 容器內是非 root 的 nginx，聽 8080。
      - "127.0.0.1:5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - skylab

  # =========================================================================
  # 監控 stack（選用）：docker compose --profile monitoring up -d
  # 說明與首次設定步驟見 docs/monitoring.md。預設所有 UI 只綁 127.0.0.1，
  # Grafana 經 nginx 的 /grafana/ 對外（Grafana 自己有登入）。
  # =========================================================================

  # -------------------------
  # Prometheus：抓 backend /metrics 與各 exporter，保留 15 天
  # -------------------------
  prometheus:
    image: prom/prometheus:v3.5.0
    logging: *default-logging
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    networks:
      - skylab
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  # -------------------------
  # Grafana：儀表板（平台、基礎設施、日誌、Proxmox）
  # -------------------------
  grafana:
    image: grafana/grafana:12.1.1
    logging: *default-logging
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-%(protocol)s://%(domain)s:%(http_port)s/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # 首次登入 admin／GRAFANA_ADMIN_PASSWORD；未設定時是 admin，Grafana 會要求立刻改密碼
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/skylab-platform.json
      # datasources.yml 以環境變數帶入 InfluxDB 連線資訊
      INFLUXDB_ORG: ${INFLUXDB_ORG:-skylab}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-proxmox}
      INFLUXDB_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN:-change-this-influxdb-token}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
      - influxdb
    networks:
      - skylab
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # -------------------------
  # Loki + Alloy：所有容器的日誌集中查詢，保留 14 天
  # -------------------------
  loki:
    image: grafana/loki:3.5.3
    logging: *default-logging
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    networks:
      - skylab
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3100/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  alloy:
    image: grafana/alloy:v1.10.0
    logging: *default-logging
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    networks:
      - skylab

  # -------------------------
  # InfluxDB 2：接收 Proxmox VE 內建 Metric Server 推送的節點／VM／儲存指標
  # （PVE → Datacenter → Metric Server → InfluxDB，不經過 SkyLab 後端）。
  # PVE 節點要連得到這裡，所以要在 .env 把 INFLUXDB_BIND_ADDRESS 改成內網 IP
  # 並換掉預設 token，見 docs/monitoring.md。
  # -------------------------
  influxdb:
    image: influxdb:2.7-alpine
    logging: *default-logging
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:-change-this-influxdb-password}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-skylab}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-proxmox}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUXDB_RETENTION:-30d}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN:-change-this-influxdb-token}
      INFLUXD_REPORTING_DISABLED: "true"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    ports:
      - "${INFLUXDB_BIND_ADDRESS:-127.0.0.1}:${INFLUXDB_HOST_PORT:-8086}:8086"
    networks:
      - skylab
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://127.0.0.1:8086"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -------------------------
  # Exporters：PostgreSQL、Redis、容器（cAdvisor）、主機（node-exporter）
  # -------------------------
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    logging: *default-logging
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      # 直連 db（不經 PgBouncer）：exporter 讀的 pg_stat_* 是 server 端統計
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - skylab

  redis-exporter:
    image: oliver006/redis_exporter:v1.74.0
    logging: *default-logging
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - skylab

  cadvisor:
    # Docker 29 預設的 containerd image store（overlayfs）要新版 cAdvisor 才讀得到；
    # 舊版會「failed to identify the read-write layer」而抓不到任何容器。映像已搬到 ghcr.io
    image: ghcr.io/google/cadvisor:v0.60.6
    logging: *default-logging
    profiles: ["monitoring"]
    restart: unless-stopped
    privileged: true
    # cgroup v2 的主機上 Docker 預設給容器私有 cgroup namespace，cAdvisor 會只看到
    # 自己（id="/"）而抓不到任何容器；必須共用主機的 cgroup namespace
    cgroup: host
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      # 只把 compose 服務／專案名稱帶成 label，其餘容器 label（config hash 等）不要
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - skylab

  node-exporter:
    image: prom/node-exporter:v1.9.1
    logging: *default-logging
    profiles: ["monitoring"]
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)
    volumes:
      - /:/host:ro
    networks:
      - skylab

  # -------------------------
  # Uptime Kuma：外部探測 + 推播（Email／Discord／LINE／Telegram…）
  # 建議監看 nginx 入口與 /api/v1/utils/health-check/ready，見 docs/monitoring.md
  # -------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:1
    logging: *default-logging
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    ports:
      - "${UPTIME_KUMA_BIND_ADDRESS:-127.0.0.1}:${UPTIME_KUMA_HOST_PORT:-3001}:3001"
    networks:
      - skylab

# -------------------------
# Volumes
# -------------------------
volumes:
  app-db-data:
  app-redis-data:
  prometheus-data:
  grafana-data:
