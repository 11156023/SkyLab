name: campus-litellm

# Included by the root Compose for normal deployment; also usable standalone.
# Run only one project at a time: both publish the same host port 4000.
# Integrated mode joins the root `skylab` network: backend/worker reach the
# gateway as http://litellm:4000 and the gateway reaches PostgreSQL directly as
# db:5432 (never through PgBouncer).  Standalone mode has no `db` service, so
# DATABASE_URL must then name an externally reachable PostgreSQL host.
services:
  litellm:
    image: ${LITELLM_IMAGE:-litellm/litellm:latest}
    restart: unless-stopped
    networks:
      - skylab
    ports:
      # Host-side access only for health checks, key provisioning and admin
      # tooling; containers use the service name on the internal network.
      - "127.0.0.1:${LITELLM_HOST_PORT:-4000}:4000"
    extra_hosts:
      # models.json deployment=local engines run on the Docker host.
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      - type: bind
        source: ./config.yaml
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in vllm-service/litellm/.env}
      VLLM_UPSTREAM_API_KEY: ${VLLM_UPSTREAM_API_KEY:?set in vllm-service/litellm/.env}
      DATABASE_URL: ${DATABASE_URL:?set in vllm-service/litellm/.env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set in vllm-service/litellm/.env}
      DO_NOT_TRACK: "true"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -f /app/config.yaml || {
          echo "Missing generated config.yaml; run vllm-service/tools/generate_litellm_config.py first." >&2
          exit 1
        }
        exec litellm --config /app/config.yaml --host 0.0.0.0 --port 4000 --telemetry False
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /app/.venv/bin/python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 4
      # The first start runs LiteLLM's database migrations before serving.
      start_period: 120s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

networks:
  # Merged with the identically defined root network when included.
  skylab:
    driver: bridge
