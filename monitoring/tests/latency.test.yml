- name: positive_overflow_exposes_clipped_quantile
  interval: 1m
  input_series:
  - series: http_request_duration_seconds_bucket{job="skylab-backend",le="300.0",method="POST",path="/api/v1/ai/pve-log/chat",workload="ai_generation"}
    values: 0+0x20
  - series: http_request_duration_seconds_bucket{job="skylab-backend",le="600.0",method="POST",path="/api/v1/ai/pve-log/chat",workload="ai_generation"}
    values: 0+9x20
  - series: http_request_duration_seconds_bucket{job="skylab-backend",le="+Inf",method="POST",path="/api/v1/ai/pve-log/chat",workload="ai_generation"}
    values: 0+10x20
  - series: http_request_duration_seconds_count{job="skylab-backend",method="POST",path="/api/v1/ai/pve-log/chat",workload="ai_generation"}
    values: 0+10x20
  promql_expr_test:
  - expr: 100 * (sum by (workload) (rate(http_request_duration_seconds_bucket{job="skylab-backend",workload="ai_generation",le="+Inf"}[15m])) - sum by (workload)
      (rate(http_request_duration_seconds_bucket{job="skylab-backend",workload="ai_generation",le="600.0"}[15m]))) / sum by (workload) (rate(http_request_duration_seconds_bucket{job="skylab-backend",workload="ai_generation",le="+Inf"}[15m]))
    eval_time: 15m
    exp_samples:
    - labels: '{workload="ai_generation"}'
      value: 10
  - expr: histogram_quantile(0.95, sum by (le, method, path) (rate(http_request_duration_seconds_bucket{job="skylab-backend",workload="ai_generation"}[15m])))
    eval_time: 15m
    exp_samples:
    - labels: '{method="POST",path="/api/v1/ai/pve-log/chat"}'
      value: 600
- name: zero_completed_samples_are_nan_not_healthy_zero
  interval: 1m
  input_series:
  - series: http_request_duration_seconds_bucket{job="skylab-backend",le="0.5",method="GET",path="/api/v1/users/me",workload="general_api"}
    values: 0+0x20
  - series: http_request_duration_seconds_bucket{job="skylab-backend",le="1.0",method="GET",path="/api/v1/users/me",workload="general_api"}
    values: 0+0x20
  - series: http_request_duration_seconds_bucket{job="skylab-backend",le="+Inf",method="GET",path="/api/v1/users/me",workload="general_api"}
