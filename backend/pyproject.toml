[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastapi[standard]<1.0.0,>=0.142.2",
    "python-multipart<1.0.0,>=0.0.32",
    "email-validator<3.0.0.0,>=2.3.0",
    "tenacity>=9.1.4,<10.0.0",
    "pydantic>=2.13.5",
    "emails<2.0,>=1.1.3",
    "jinja2<4.0.0,>=3.1.6",
    "alembic<2.0.0,>=1.20.0",
    "httpx>=0.28.1,<1.0.0",
    "psycopg[binary]<4.0.0,>=3.3.6",
    "sqlmodel<1.0.0,>=0.0.47",
    "pydantic-settings>=2.15.0,<3.0.0",
    "sentry-sdk[fastapi]>=2.71.0,<3.0.0",
    "pyjwt>=2.15.1,<3.0.0",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "proxmoxer>=2.3.0",
    "websockets>=16.0",
    "cryptography>=50.0.2",
    "paramiko>=5.0.0",
    "redis[hiredis]>=8.1.0",
    "pyyaml>=6.0.3",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "prometheus-client>=0.26.0",
    "arq>=0.28.0",
    "ldap3>=2.9.1,<3",
    "pywebpush>=2.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "mypy<3.0.0,>=2.4.0",
    "ruff<1.0.0,>=0.16.10",
    "prek>=0.5.4,<1.0.0",
    "coverage<8.0.0,>=7.16.2",
    "types-ldap3>=2.9.13.20260827",
]

[tool.pytest.ini_options]
# Auto-mode: async test functions are awaited without needing
# @pytest.mark.asyncio decorator on each one. Existing decorators stay valid.
asyncio_mode = "auto"
markers = [
    "performance: 併發壓力測試（層1 需測試 DB；層2 無外部依賴）",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "alembic"]

[[tool.mypy.overrides]]
# pywebpush 與 py_vapid 沒有型別標記（Web Push 推播）；yaml 讀 VM 帳號命名政策設定檔
module = ["pywebpush", "py_vapid", "yaml"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
# Re-export modules legitimately import-and-re-expose names.
"__init__.py" = ["F401"]
# FastAPI route handlers receive auth/permission dependencies (e.g.
# `current_user: AdminUser`) that act as guards even when the body never
# reads them. Same pattern applies to lifespan/middleware factories and
# WebSocket / rate-limit dependency callables.
"app/api/routes/*" = ["ARG001"]
"app/api/deps/*" = ["ARG001"]
"app/main.py" = ["ARG001"]
# Service modules in active development — interface conformance and
# placeholder parameters intentionally remain unused while behind feature
# flags or future refactors. Do not silently fix.
"app/services/vm/*" = ["ARG001", "F841"]
"app/services/scheduling/*" = ["ARG001"]
"app/services/network/*" = ["ARG001"]
# Tests rely on print() for debug output and accept fixture/mock arguments
# that are intentionally unused. Some env-bootstrap tests must set env vars
# before the import they exercise (E402).
"tests/*" = ["T201", "ARG001", "F401", "E402", "F841", "C408"]

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true
