# Cache-Control 依路徑決定；map 出空字串時 add_header 不會送出該標頭。
# 用一個 server 層的 add_header 搭配 map，而不是在各 location 內各寫一份：
# nginx 的 add_header 只要在 location 內出現一次，就不再繼承 server 層那整組
# 安全標頭（先前 /sw.js 的 location 就是這樣把 CSP 等標頭丟掉了）。
map $uri $skylab_cache_control {
  default "";
  # Vite 產出的 /assets/* 檔名帶 content hash，內容永不改變 → 可以長期快取，
  # 回訪使用者不必重新下載 monaco / recharts 等大 bundle。
  ~^/assets/ "public, max-age=31536000, immutable";
  # SPA shell 一定要每次回源驗證，否則部署新版後舊 index.html 會指到已不存在的 asset。
  /index.html "no-cache, max-age=0, must-revalidate";
  # Web Push Service Worker — must never be served stale: a CDN in front
  # (Cloudflare caches .js by default) would pin browsers to an old worker.
  # Root scope needs the file at /sw.js, so it cannot live under /assets/.
  /sw.js "no-cache, max-age=0, must-revalidate";
}

server {
  # 非 root 的 nginx 容器（nginxinc/nginx-unprivileged）不能綁 <1024 的 port
  listen 8080;
  root /usr/share/nginx/html;

  # 安全標頭：後端的 SecurityHeadersMiddleware 只套在 /api 回應，SPA 本體
  # （index.html，承載 token 與所有 JS）以前完全沒有 CSP／防 iframe。
  # `always` 讓 404／index fallback 也帶到。CSP 放行：Google Identity（登入
  # 按鈕）、字型、blob:/data:（附件預覽、主題背景）、同源 WS。
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' wss: https:; frame-src 'self' blob: https://accounts.google.com/gsi/; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Cache-Control $skylab_cache_control always;

  # Static assets — return real 404 instead of falling back to index.html.
  # Otherwise an early request (before deploy lands a new asset) gets HTML,
  # and any CDN in front (e.g. Cloudflare) caches that HTML under the asset URL.
  location ~* \.(ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|eot|css|js|map|json|txt|xml)$ {
    try_files $uri =404;
  }

  # SPA shell — every other path falls back to index.html for client-side routing.
  location / {
    index index.html index.htm;
    try_files $uri /index.html;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
